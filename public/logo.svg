<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="20" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bc"/>
      <stop offset="100%" stop-color="#0a5549"/>
    </linearGradient>
  </defs>
  <!-- Background filled circle -->
  <circle cx="50" cy="56" r="36" fill="url(#bg)"/>
  <!-- Outer ring highlight -->
  <circle cx="50" cy="56" r="36" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" fill="none"/>
  <!-- Horizontal divider line -->
  <line x1="14" y1="56" x2="86" y2="56" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.92"/>
  <!-- Triangle mouth: pointing downward into upper half -->
  <polygon points="50,50 41,36 59,36" fill="white" opacity="0.95"/>
  <!-- Left antenna stem -->
  <line x1="37" y1="22" x2="28" y2="10" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.92"/>
  <!-- Left antenna ball -->
  <circle cx="26" cy="8" r="4.5" fill="white" opacity="0.92"/>
  <!-- Right antenna stem -->
  <line x1="63" y1="22" x2="72" y2="10" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.92"/>
  <!-- Right antenna ball -->
  <circle cx="74" cy="8" r="4.5" fill="white" opacity="0.92"/>
</svg>
